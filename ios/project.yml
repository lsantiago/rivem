# XcodeGen spec used by CI (macOS runner): `xcodegen generate` -> RIVEM.xcodeproj
name: RIVEM
options:
  bundleIdPrefix: com.rivem
  deploymentTarget:
    iOS: "17.0"
packages:
  RiverCorePackage:
    path: .
targets:
  RIVEM:
    type: application
    platform: iOS
    sources:
      - path: Sources/RIVEM
    dependencies:
      - package: RiverCorePackage
        product: RiverCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rivem.app
        INFOPLIST_FILE: Info.plist
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.5.0"
        CURRENT_PROJECT_VERSION: "5"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    scheme:
      testTargets:
        - RiverCoreTests
  RiverCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RiverCoreTests
    dependencies:
      - package: RiverCorePackage
        product: RiverCore
    settings:
      base:
        SWIFT_VERSION: "5.0"
