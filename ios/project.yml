# XcodeGen spec used by CI (macOS runner): `xcodegen generate` -> RIVEM.xcodeproj
name: RIVEM
options:
  bundleIdPrefix: com.rivem
  deploymentTarget:
    iOS: "17.0"
packages:
  RiverCorePackage:
    path: .
targets:
  RIVEM:
    type: application
    platform: iOS
    sources:
      - path: Sources/RIVEM
      # app icon (generated by ../tools/make_icons.py); kept outside Sources so SwiftPM ignores it
      - path: AppIcon/Assets.xcassets
      # RIVeR's pisco example (frames from ci/fetch-example.sh), copied into the bundle as the folder "Examples"
      - path: Examples
        type: folder
        buildPhase: resources
        optional: true
    dependencies:
      - package: RiverCorePackage
        product: RiverCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rivem.app
        INFOPLIST_FILE: Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "0.6.3"
        CURRENT_PROJECT_VERSION: "18"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
    scheme:
      testTargets:
        - RiverCoreTests
  RiverCoreTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests/RiverCoreTests
    dependencies:
      - package: RiverCorePackage
        product: RiverCore
    settings:
      base:
        SWIFT_VERSION: "5.0"
