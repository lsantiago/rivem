name: Android CI

on:
  push:
    paths: ["android/**", "ci/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", "ci/**", ".github/workflows/android.yml"]
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Core tests and debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Core tests (same cases and ci/testdata as the Swift core)
        run: gradle :core:test --no-daemon --stacktrace

      - name: Example frames (river Pisco, bundled as assets)
        run: bash ci/fetch-example.sh

      - name: Debug APK
        run: gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RIVEM-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-test-reports
          path: android/core/build/reports/tests/
          if-no-files-found: ignore
